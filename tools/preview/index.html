<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>晚自习之后 · 试玩预览</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; background:#0a0a0c; overflow:hidden;
    font-family: "Noto Serif CJK SC","Source Han Serif SC","Songti SC",SimSun,"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",serif;
    color:#e6e3dc; user-select:none; }
  #app { position:relative; width:100vw; height:100vh; overflow:hidden; }
  canvas#bg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #fxlayer { position:absolute; inset:0; pointer-events:none; }
  #topbar { position:absolute; top:0; left:0; right:0; height:52px; display:flex; align-items:center;
    gap:6px; padding:0 10px; background:rgba(8,8,10,.8); border-bottom:1px solid rgba(120,112,100,.35); z-index:20; }
  #stats { flex:1; display:flex; gap:14px; font-size:15px; letter-spacing:.5px; }
  .stat b { font-weight:400; }
  #topbar button, .btn { background:rgba(30,28,30,.9); color:#ded9d1; border:1px solid rgba(120,112,100,.5);
    border-radius:3px; padding:7px 12px; font-size:14px; font-family:inherit; cursor:pointer; }
  #topbar button:active, .btn:active { background:#3a1d1a; }
  #topbar button.on { color:#ffb9a4; border-color:#a4564a; }
  #clickarea { position:absolute; inset:0; z-index:5; }
  #box { position:absolute; left:3%; right:3%; bottom:16px; min-height:172px; z-index:10;
    background:rgba(11,11,14,.90); border:1px solid rgba(128,120,108,.55); border-radius:4px;
    padding:16px 24px 30px; box-shadow:0 6px 26px rgba(0,0,0,.7); }
  #who { font-size:19px; color:#dcb887; margin-bottom:6px; min-height:22px; letter-spacing:1px; }
  #text { font-size:21px; line-height:1.75; white-space:pre-wrap; min-height:90px; }
  #text .narr { color:#b9b6ae; }
  #text .note { color:#c9a24a; font-style:italic; }
  #next { position:absolute; right:18px; bottom:8px; color:#c98b46; font-size:16px; animation:bl 1.1s infinite; }
  @keyframes bl { 0%,100%{opacity:.25} 50%{opacity:1} }
  #choices { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); z-index:15;
    display:flex; flex-direction:column; align-items:center; gap:11px; padding:0 6%; }
  #choices button { width:min(720px,94%); text-align:left; padding:14px 20px; font-size:19px; line-height:1.5;
    background:rgba(16,15,18,.95); color:#e6e3dc; border:1px solid rgba(128,120,108,.6); border-radius:3px;
    font-family:inherit; cursor:pointer; animation:fi .25s ease both; }
  #choices button:active { background:#3c1e1a; border-color:#a4564a; }
  #choices button.locked { color:#6a6660; border-color:#3a3a38; }
  #choices button .hint { color:#8a6a4a; font-size:15px; }
  @keyframes fi { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .modal { position:absolute; inset:0; z-index:40; background:rgba(3,3,5,.92); display:flex;
    align-items:center; justify-content:center; padding:24px; }
  .paper { background:#d4d0c5; color:#22211d; padding:28px 34px; max-width:760px; width:100%;
    white-space:pre-wrap; line-height:1.85; font-size:19px; border:1px solid #6a6558; box-shadow:0 8px 40px #000; }
  .sheet { background:#0f0f11; border:1px solid rgba(128,120,108,.5); max-width:860px; width:100%;
    max-height:86vh; overflow:auto; padding:22px 26px; }
  .sheet h2 { margin:0 0 12px; font-size:24px; color:#dcb887; font-weight:400; }
  .sheet .row { padding:8px 0; border-bottom:1px solid rgba(120,112,100,.18); font-size:17px; line-height:1.6; }
  .sheet .row.locked { color:#5a5852; }
  .center { text-align:center; }
  #title { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; background:rgba(4,4,6,.55); }
  #title h1 { font-size:clamp(38px,8vw,84px); margin:0; letter-spacing:8px; text-shadow:3px 3px 0 rgba(120,12,10,.6); }
  #title .sub { color:#93908a; letter-spacing:5px; font-size:14px; margin-bottom:20px; }
  #title button { width:min(360px,80vw); padding:13px; font-size:19px; }
  #warn { position:absolute; bottom:14px; left:0; right:0; text-align:center; color:#8d8a84; font-size:12px; }
  .bigcard { position:absolute; inset:0; z-index:35; display:flex; flex-direction:column; gap:10px;
    align-items:center; justify-content:center; background:#050506; pointer-events:none; }
  .bigcard .idx { color:#a85648; font-size:19px; letter-spacing:4px; }
  .bigcard .t { font-size:clamp(30px,6vw,58px); letter-spacing:6px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <canvas id="fxlayer"></canvas>
  <div id="clickarea"></div>
  <div id="topbar">
    <div id="stats"></div>
    <button id="bAuto">自动</button>
    <button id="bSkip">快进</button>
    <button id="bLog">回想</button>
    <button id="bClue">线索</button>
    <button id="bStat">状态</button>
    <button id="bMenu">设置</button>
  </div>
  <div id="box"><div id="who"></div><div id="text"></div><div id="next">▼</div></div>
  <div id="choices"></div>
</div>
<script src="player.js"></script>
</body>
</html>
